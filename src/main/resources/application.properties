server.port=${PORT:8080}
spring.datasource.url=${AGAP_DATABASE_URL:jdbc:h2:file:./data/agap;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AGAP_DATABASE_USERNAME:sa}
spring.datasource.password=${AGAP_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${AGAP_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${AGAP_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.jackson.property-naming-strategy=SNAKE_CASE
